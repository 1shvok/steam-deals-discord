name: Test ITAD Discord

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run Steam Deals
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python itad_test.py

      - name: Save deal history
        run: |
          git config user.name "steam-deals-bot"
          git config user.email "steam-deals-bot@users.noreply.github.com"

          git add sent_deals.json

          if git diff --cached --quiet; then
            echo "No changes to deal history."
          else
            git commit -m "Update sent deals history"
            git push
          fi
